<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}NEPSE Portfolio{% endblock %}</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js" defer></script>
  <style>
    /* ── Design tokens ──────────────────────────────────────────────────── */
    :root {
      --ink:       #0f172a;
      --ink-2:     #334155;
      --ink-3:     #64748b;
      --ink-4:     #94a3b8;
      --surface:   #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #f1f5f9;
      --border:    #e2e8f0;
      --blue:      #2563eb;
      --blue-dim:  #dbeafe;
      --blue-dark: #1e40af;
      --green:     #16a34a;
      --green-dim: #dcfce7;
      --red:       #dc2626;
      --red-dim:   #fee2e2;
      --gold:      #d97706;
      --gold-dim:  #fef3c7;
      --radius:    10px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
      --shadow:    0 4px 16px rgba(0,0,0,.08);
      --font-mono: 'Courier New', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--surface-2);
      color: var(--ink);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Nav ──────────────────────────────────────────────────────────── */
    .nav {
      background: var(--ink);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #1e293b;
    }
    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      height: 56px;
      gap: 32px;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -.01em;
    }
    .nav-brand span.bull {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      background: var(--blue);
      border-radius: 6px;
      font-size: 16px;
    }
    .nav-links { display: flex; gap: 4px; margin-left: auto; }
    .nav-links a {
      color: #94a3b8;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      transition: background .15s, color .15s;
    }
    .nav-links a:hover        { background: #1e293b; color: #fff; }
    .nav-links a.active       { background: #1e3a5f; color: #60a5fa; }

    /* ── Layout ───────────────────────────────────────────────────────── */
    .page { max-width: 1200px; margin: 0 auto; padding: 28px 24px 48px; }
    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 22px; font-weight: 700; color: var(--ink); }
    .page-header p  { color: var(--ink-3); font-size: 13px; margin-top: 2px; }

    /* ── Cards ────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 20px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 14px;
    }

    /* ── Stat cards ───────────────────────────────────────────────────── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow-sm); }
    .stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-bottom: 6px; }
    .stat-value { font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1.1; }
    .stat-sub   { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
    .stat-card.green { border-left: 3px solid var(--green); }
    .stat-card.red   { border-left: 3px solid var(--red); }
    .stat-card.blue  { border-left: 3px solid var(--blue); }
    .stat-card.gold  { border-left: 3px solid var(--gold); }
    .text-green { color: var(--green) !important; }
    .text-red   { color: var(--red)   !important; }
    .text-blue  { color: var(--blue)  !important; }
    .text-gold  { color: var(--gold)  !important; }

    /* ── Tables ───────────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-sm); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      background: var(--surface-2);
      color: var(--ink-3);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody td { padding: 11px 14px; border-bottom: 1px solid var(--surface-3); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--surface-2); }
    .text-right { text-align: right; }
    .text-center { text-align: center; }

    /* ── Badges ───────────────────────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .badge-buy    { background: var(--blue-dim);  color: var(--blue-dark); }
    .badge-ipo    { background: var(--gold-dim);  color: #92400e; }
    .badge-bonus  { background: var(--green-dim); color: #166534; }
    .badge-right  { background: #f3e8ff;          color: #6b21a8; }
    .badge-merger { background: #fff7ed;          color: #9a3412; }
    .badge-gift   { background: #fce7f3;          color: #9d174d; }
    .badge-others { background: var(--surface-3); color: var(--ink-2); }

    /* ── Buttons ──────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 7px; font-size: 13px;
      font-weight: 600; cursor: pointer; border: none; transition: all .15s;
      text-decoration: none;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-secondary { background: var(--surface-3); color: var(--ink-2); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: var(--red-dim); color: var(--red); }
    .btn-danger:hover { background: #fca5a5; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-icon { padding: 6px; background: none; border: none; cursor: pointer; color: var(--ink-3); border-radius: 5px; }
    .btn-icon:hover { background: var(--surface-3); color: var(--ink); }

    /* ── Modal ────────────────────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal {
      background: var(--surface); border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
    }
    .modal-header {
      padding: 20px 24px 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-header h2 { font-size: 17px; font-weight: 700; }
    .modal-body { padding: 20px 24px 24px; }

    /* ── Forms ────────────────────────────────────────────────────────── */
    .form-group { margin-bottom: 14px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
    input, select, textarea {
      width: 100%; padding: 8px 12px;
      border: 1px solid var(--border); border-radius: 7px;
      font-size: 13px; color: var(--ink); background: var(--surface);
      transition: border-color .15s, box-shadow .15s; outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }

    /* ── Chips / filters ──────────────────────────────────────────────── */
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      padding: 4px 12px; border-radius: 20px; font-size: 12px;
      font-weight: 600; cursor: pointer; border: 1px solid var(--border);
      background: var(--surface); color: var(--ink-3); transition: all .12s;
    }
    .chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }

    /* ── Toast ────────────────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 999;
      background: var(--ink); color: #fff; padding: 12px 18px;
      border-radius: 8px; font-size: 13px; font-weight: 500;
      box-shadow: var(--shadow);
      animation: slideUp .2s ease;
    }
    .toast.success { background: var(--green); }
    .toast.error   { background: var(--red); }
    @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* ── Grid layouts ─────────────────────────────────────────────────── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }

    /* ── Misc ─────────────────────────────────────────────────────────── */
    .mb-4 { margin-bottom: 16px; }
    .mb-6 { margin-bottom: 24px; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .divider { height: 1px; background: var(--border); margin: 20px 0; }
    .mono { font-family: var(--font-mono); }
    .symbol-pill {
      display: inline-block; background: var(--surface-3); color: var(--ink);
      font-weight: 700; font-size: 13px; padding: 2px 8px; border-radius: 5px;
      font-family: var(--font-mono);
    }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid currentColor; border-top-color: transparent;
      border-radius: 50%; animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 48px 24px; color: var(--ink-3); }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--ink-2); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="/">
        <span class="bull">📈</span>
        NEPSE Tracker
      </a>
      <div class="nav-links">
        <a href="/"         class="{% if request.path == '/' %}active{% endif %}">Dashboard</a>
        <a href="/holdings" class="{% if request.path == '/holdings' %}active{% endif %}">Holdings</a>
        <a href="/settings" class="{% if request.path == '/settings' %}active{% endif %}">Settings</a>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <div id="toast-container"></div>
  <script>
    function showToast(msg, type = '') {
      const el = document.createElement('div');
      el.className = 'toast' + (type ? ' ' + type : '');
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }
  </script>
</body>
</html>
